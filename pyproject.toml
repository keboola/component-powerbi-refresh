[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "component-powerbi-refresh"
dynamic = ["version"]
description = "Power BI Dataset Refresh component for Keboola Connection"
readme = "README.md"
requires-python = "~=3.13.0"
dependencies = [
    "backoff>=2.2.1",
    "keboola-component>=1.9.0",
    "requests>=2.32.4",
]

[dependency-groups]
dev = [
    "freezegun>=1.5.1",
    "keboola.datadirtest>=2.0.0",
    "pytest>=9.0.0",
    "ruff>=0.15.0",
]

[tool.pytest.ini_options]
log_cli_level = "WARNING"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
extend-select = ["I", "UP"]
